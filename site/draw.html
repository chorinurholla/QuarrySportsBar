<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Draw — Quarry Sports Bar</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--night:#000;--surface:#161616;--text:#F3F3F3;--muted:#ABABAB;--amber:#FFB300;--border:#2E2E2E}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--night);color:var(--text);font-family:'Outfit',system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       padding:4vmin;text-align:center;overflow:hidden}
  .logo{position:fixed;top:3vmin;left:50%;transform:translateX(-50%);height:9vmin;opacity:.95}
  h1{font-size:6.5vmin;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  h1 em{font-style:normal;color:var(--amber)}
  .sub{color:var(--muted);font-size:2.6vmin;margin-top:1vmin;font-weight:500}
  .stage{display:flex;gap:5vmin;align-items:center;justify-content:center;margin:4vmin 0;width:100%}
  .bigball{width:22vmin;height:22vmin;border-radius:999px;display:grid;place-items:center;flex:none;
        font-size:10vmin;font-weight:700;font-variant-numeric:tabular-nums;
        border:.7vmin dashed var(--border);color:var(--muted);transition:transform .15s ease-out}
  .bigball.spinning{border:.7vmin solid var(--border);color:var(--text);background:var(--surface)}
  .bigball.locked{border:none;background:var(--amber);color:var(--night);transform:scale(1.06)}
  .bigball.bingo{background:var(--amber);color:var(--night);border:none;
        animation:pulse 0.7s ease-in-out infinite alternate}
  @keyframes pulse{from{transform:scale(1.02)}to{transform:scale(1.14)}}
  .board{display:flex;flex-wrap:wrap;gap:1.1vmin;justify-content:flex-start;align-content:flex-start;
        max-width:60vmin;min-height:22vmin}
  .chip{width:5.6vmin;height:5.6vmin;border-radius:999px;background:var(--surface);
        border:.3vmin solid var(--border);color:var(--text);display:grid;place-items:center;
        font-size:2.6vmin;font-weight:600;font-variant-numeric:tabular-nums}
  .chip.latest{background:var(--amber);color:var(--night);border-color:var(--amber)}
  .status{font-size:3vmin;font-weight:600;min-height:4vmin}
  .status .amber{color:var(--amber)}
  .count{font-size:9vmin;font-weight:700;font-variant-numeric:tabular-nums;color:var(--amber);margin-top:1vmin}
  .seal{margin-top:3vmin;color:var(--muted);font-size:1.9vmin;max-width:80vmin;word-break:break-all;line-height:1.5}
  .seal code{color:var(--text)}
  .tiers{display:none;gap:4vmin;justify-content:center;margin-top:3vmin;font-size:2.6vmin;font-weight:600}
  .tiers.show{display:flex}
  .tiers span b{color:var(--amber)}
  .demo-btn{margin-top:4vmin;font:inherit;font-weight:600;font-size:2.4vmin;padding:1.6vmin 3.2vmin;
            background:var(--amber);color:var(--night);border:none;border-radius:.6vmin;cursor:pointer}
  .demo-tag{position:fixed;top:3vmin;right:3vmin;background:var(--amber);color:var(--night);
            font-weight:700;font-size:2vmin;padding:.5vmin 1.4vmin;letter-spacing:.08em;display:none}
  .foot{position:fixed;bottom:2.5vmin;left:0;right:0;color:var(--muted);font-size:1.8vmin}
  @media (prefers-reduced-motion: reduce){ .ball{transition:none} }
</style>
</head>
<body>
  <img class="logo" src="assets/logo-badge-white.png" alt="Quarry Sports Bar">
  <div class="demo-tag" id="demo-tag">DEMO</div>

  <h1>7 <em>Lucky</em> Numbers <span style="font-size:.6em;color:var(--muted)">· BINGO</span></h1>
  <p class="sub" id="sub">First to complete all 7 wins ₦20,000 credit — guaranteed winner</p>

  <div class="stage">
    <div class="bigball" id="bigball">·</div>
    <div class="board" id="board" aria-label="Numbers drawn so far"></div>
  </div>

  <p class="status" id="status">Loading…</p>
  <div class="count" id="count" hidden></div>

  <div class="tiers" id="tiers">
    <span>Ball <b id="ballno">–</b> of the draw</span>
    <span>BINGO wins <b>₦20,000</b> bar &amp; kitchen credit</span>
    <span>Ties on the same ball <b>share</b></span>
  </div>

  <p class="seal" id="seal"></p>
  <button class="demo-btn" id="demo-btn" hidden>Run a demo draw</button>

  <p class="foot">Provably fair — the result is sealed before numbers close. Verify at quarrysportsbar.com/winners</p>

<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var API = window.QUARRY_API || null;
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var bigEl = document.getElementById('bigball');
  var boardEl = document.getElementById('board');
  var statusEl = document.getElementById('status');
  var countEl = document.getElementById('count');
  var sealEl = document.getElementById('seal');
  var tiersEl = document.getElementById('tiers');
  var ballnoEl = document.getElementById('ballno');
  var subEl = document.getElementById('sub');

  var week = null;
  var shown = false;
  var showing = false;

  function fmtTime(iso) {
    try { return new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }
    catch (e) { return ''; }
  }

  function addChip(n, latest) {
    var prev = boardEl.querySelector('.chip.latest');
    if (prev) prev.classList.remove('latest');
    var c = document.createElement('div');
    c.className = 'chip' + (latest ? ' latest' : '');
    c.textContent = n;
    boardEl.appendChild(c);
  }

  /* ---------- The bingo show ---------- */
  function runShow(sequence, winningBall, isDemo) {
    if (showing || shown) return;
    showing = true;
    countEl.hidden = true;
    boardEl.innerHTML = '';
    tiersEl.classList.add('show');
    statusEl.innerHTML = 'Check your slips — here we <span class="amber">go</span>…';
    var upto = winningBall || sequence.length;

    if (REDUCED) {
      for (var r = 0; r < upto; r++) addChip(sequence[r], r === upto - 1);
      finishShow(sequence, upto, isDemo);
      return;
    }
    var i = 0;
    function nextBall() {
      if (i >= upto) { finishShow(sequence, upto, isDemo); return; }
      ballnoEl.textContent = (i + 1);
      bigEl.className = 'bigball spinning';
      var t = 0;
      var iv = setInterval(function () {
        bigEl.textContent = Math.floor(Math.random() * 50);
        t += 55;
        if (t >= (i < 5 ? 1400 : 900)) {   // slightly quicker after the first few
          clearInterval(iv);
          bigEl.textContent = sequence[i];
          bigEl.className = 'bigball locked';
          addChip(sequence[i], true);
          i++;
          setTimeout(nextBall, i >= upto ? 700 : 650);
        }
      }, 55);
    }
    nextBall();
  }

  function finishShow(sequence, upto, isDemo) {
    showing = false; shown = true;
    bigEl.textContent = sequence[upto - 1];
    bigEl.className = 'bigball bingo';
    ballnoEl.textContent = upto;
    statusEl.innerHTML = isDemo
      ? '<span class="amber">BINGO on ball ' + upto + '!</span> Demo only — no real draw happened.'
      : '<span class="amber">BINGO on ball ' + upto + '!</span> Completed all 7? Bring your slip to the bar!';
    if (!isDemo && week && week.draw_seed) {
      sealEl.innerHTML = 'Seed: <code>' + week.draw_seed + '</code> — verify the whole drawing order on the Winners page.';
    }
  }

  /* ---------- Waiting states (live) ---------- */
  function renderWaiting() {
    if (!week) { statusEl.textContent = 'No draw scheduled today.'; return; }
    subEl.textContent = 'First to complete all 7 wins ₦20,000 credit — draw at ' + fmtTime(week.draw_time);
    if (week.draw_commit) {
      statusEl.innerHTML = 'The entire drawing order is <span class="amber">sealed</span>. Nobody can change it — not even us.';
      sealEl.innerHTML = 'Fingerprint: <code>' + week.draw_commit + '</code>';
    } else {
      statusEl.textContent = 'Numbers close at ' + fmtTime(week.numbers_close) + '.';
    }
    var target = new Date(week.draw_time).getTime();
    var remain = target - Date.now();
    if (remain > 0 && remain < 24 * 3600 * 1000) {
      countEl.hidden = false;
      var m = Math.floor(remain / 60000), s = Math.floor((remain % 60000) / 1000);
      countEl.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    } else {
      countEl.hidden = true;
    }
  }

  async function poll() {
    try {
      var res = await fetch(API + '/week');
      var data = await res.json();
      week = data && data.week;
    } catch (e) { /* keep last known */ }
    if (week && week.drawn_numbers && !shown && !showing) {
      runShow(week.drawn_numbers, week.winning_ball, false);
    } else if (!shown && !showing) {
      renderWaiting();
    }
  }

  if (API) {
    poll();
    setInterval(poll, 5000);
    setInterval(function () { if (!shown && !showing) renderWaiting(); }, 1000);
  } else {
    document.getElementById('demo-tag').style.display = 'block';
    var btn = document.getElementById('demo-btn');
    btn.hidden = false;
    statusEl.textContent = 'Demo mode — the real draw only ever comes from the server.';
    btn.addEventListener('click', function () {
      shown = false;
      boardEl.innerHTML = '';
      bigEl.textContent = '·'; bigEl.className = 'bigball';
      // demo: shuffle 0-49, stop at a realistic bingo ball
      var seq = [];
      for (var k = 0; k < 50; k++) seq.push(k);
      for (var i = 49; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = seq[i]; seq[i] = seq[j]; seq[j] = t;
      }
      var wb = 24 + Math.floor(Math.random() * 12); // ball 24-35
      btn.hidden = true;
      runShow(seq, wb, true);
      setTimeout(function () { btn.hidden = false; }, 45000);
    });
  }
})();
</script>
</body>
</html>
