<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Draw — Quarry Sports Bar</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--night:#000;--surface:#161616;--text:#F3F3F3;--muted:#ABABAB;--amber:#FFB300;--border:#2E2E2E}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--night);color:var(--text);font-family:'Outfit',system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       padding:4vmin;text-align:center;overflow:hidden}
  .logo{position:fixed;top:3vmin;left:50%;transform:translateX(-50%);height:9vmin;opacity:.95}
  h1{font-size:6.5vmin;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  h1 em{font-style:normal;color:var(--amber)}
  .sub{color:var(--muted);font-size:2.6vmin;margin-top:1vmin;font-weight:500}
  .balls{display:flex;gap:2.2vmin;justify-content:center;flex-wrap:wrap;margin:5vmin 0}
  .ball{width:14vmin;height:14vmin;border-radius:999px;display:grid;place-items:center;
        font-size:6vmin;font-weight:700;font-variant-numeric:tabular-nums;
        border:.5vmin dashed var(--border);color:var(--muted);
        transition:transform .18s ease-out}
  .ball.spinning{border:.5vmin solid var(--border);color:var(--text);background:var(--surface)}
  .ball.locked{border:none;background:var(--amber);color:var(--night);transform:scale(1.08)}
  .status{font-size:3vmin;font-weight:600;min-height:4vmin}
  .status .amber{color:var(--amber)}
  .count{font-size:9vmin;font-weight:700;font-variant-numeric:tabular-nums;color:var(--amber);margin-top:1vmin}
  .seal{margin-top:3vmin;color:var(--muted);font-size:1.9vmin;max-width:80vmin;word-break:break-all;line-height:1.5}
  .seal code{color:var(--text)}
  .tiers{display:none;gap:4vmin;justify-content:center;margin-top:3vmin;font-size:2.6vmin;font-weight:600}
  .tiers.show{display:flex}
  .tiers span b{color:var(--amber)}
  .demo-btn{margin-top:4vmin;font:inherit;font-weight:600;font-size:2.4vmin;padding:1.6vmin 3.2vmin;
            background:var(--amber);color:var(--night);border:none;border-radius:.6vmin;cursor:pointer}
  .demo-tag{position:fixed;top:3vmin;right:3vmin;background:var(--amber);color:var(--night);
            font-weight:700;font-size:2vmin;padding:.5vmin 1.4vmin;letter-spacing:.08em;display:none}
  .foot{position:fixed;bottom:2.5vmin;left:0;right:0;color:var(--muted);font-size:1.8vmin}
  @media (prefers-reduced-motion: reduce){ .ball{transition:none} }
</style>
</head>
<body>
  <img class="logo" src="assets/logo-badge-white.png" alt="Quarry Sports Bar">
  <div class="demo-tag" id="demo-tag">DEMO</div>

  <h1>7 <em>Lucky</em> Numbers</h1>
  <p class="sub" id="sub">Live at Quarry Sports Bar</p>

  <div class="balls" id="balls">
    <div class="ball">·</div><div class="ball">·</div><div class="ball">·</div><div class="ball">·</div>
    <div class="ball">·</div><div class="ball">·</div><div class="ball">·</div>
  </div>

  <p class="status" id="status">Loading…</p>
  <div class="count" id="count" hidden></div>

  <div class="tiers" id="tiers">
    <span>Match 5 · <b>₦5,000</b> credit</span>
    <span>Match 6 · <b>₦10,000</b> credit</span>
    <span>Match all 7 · <b>₦20,000</b> credit</span>
  </div>

  <p class="seal" id="seal"></p>
  <button class="demo-btn" id="demo-btn" hidden>Run a demo draw</button>

  <p class="foot">Provably fair — the result is sealed before numbers close. Verify at quarrysportsbar.com/winners</p>

<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var API = window.QUARRY_API || null;
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var ballEls = Array.prototype.slice.call(document.querySelectorAll('#balls .ball'));
  var statusEl = document.getElementById('status');
  var countEl = document.getElementById('count');
  var sealEl = document.getElementById('seal');
  var tiersEl = document.getElementById('tiers');
  var subEl = document.getElementById('sub');

  var week = null;
  var shown = false;   // show already played
  var showing = false; // show in progress

  function fmtTime(iso) {
    try { return new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }
    catch (e) { return ''; }
  }

  /* ---------- The show ---------- */
  function runShow(numbers, isDemo) {
    if (showing || shown) return;
    showing = true;
    countEl.hidden = true;
    statusEl.innerHTML = 'Here we <span class="amber">go</span>…';
    if (REDUCED) {
      ballEls.forEach(function (b, i) { b.textContent = numbers[i]; b.className = 'ball locked'; });
      finishShow(isDemo);
      return;
    }
    var i = 0;
    function spinNext() {
      if (i >= 7) { finishShow(isDemo); return; }
      var ball = ballEls[i];
      ball.className = 'ball spinning';
      var t = 0;
      var iv = setInterval(function () {
        ball.textContent = Math.floor(Math.random() * 50);
        t += 60;
        if (t >= 1800) {
          clearInterval(iv);
          ball.textContent = numbers[i];
          ball.className = 'ball locked';
          i++;
          setTimeout(spinNext, 450);
        }
      }, 60);
    }
    spinNext();
  }

  function finishShow(isDemo) {
    showing = false; shown = true;
    statusEl.innerHTML = isDemo
      ? 'Demo only — no real numbers were drawn.'
      : 'Tonight\'s numbers — <span class="amber">match 5, 6 or 7 to win!</span>';
    tiersEl.classList.add('show');
    if (!isDemo && week && week.draw_seed) {
      sealEl.innerHTML = 'Seed: <code>' + week.draw_seed + '</code> — check it against the fingerprint on the Winners page.';
    }
  }

  /* ---------- Waiting states (live) ---------- */
  function renderWaiting() {
    if (!week) { statusEl.textContent = 'No draw scheduled today.'; return; }
    subEl.textContent = 'Live at Quarry Sports Bar — draw at ' + fmtTime(week.draw_time);
    if (week.draw_commit) {
      statusEl.innerHTML = 'The draw is <span class="amber">sealed</span>. Nobody can change it — not even us.';
      sealEl.innerHTML = 'Fingerprint: <code>' + week.draw_commit + '</code>';
    } else {
      statusEl.textContent = 'Numbers close at ' + fmtTime(week.numbers_close) + '.';
    }
    // countdown to draw time
    var target = new Date(week.draw_time).getTime();
    var remain = target - Date.now();
    if (remain > 0 && remain < 24 * 3600 * 1000) {
      countEl.hidden = false;
      var m = Math.floor(remain / 60000), s = Math.floor((remain % 60000) / 1000);
      countEl.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    } else {
      countEl.hidden = true;
    }
  }

  async function poll() {
    try {
      var res = await fetch(API + '/week');
      var data = await res.json();
      week = data && data.week;
    } catch (e) { /* keep last known */ }
    if (week && week.drawn_numbers && !shown && !showing) {
      runShow(week.drawn_numbers, false);
    } else if (!shown && !showing) {
      renderWaiting();
    }
  }

  if (API) {
    poll();
    setInterval(poll, 5000);
    setInterval(function () { if (!shown && !showing) renderWaiting(); }, 1000);
  } else {
    // Demo mode (opened from disk): button-triggered fake draw, clearly labelled
    document.getElementById('demo-tag').style.display = 'block';
    var btn = document.getElementById('demo-btn');
    btn.hidden = false;
    statusEl.textContent = 'Demo mode — the real draw only ever comes from the server.';
    btn.addEventListener('click', function () {
      shown = false;
      ballEls.forEach(function (b) { b.textContent = '·'; b.className = 'ball'; });
      tiersEl.classList.remove('show');
      var nums = [];
      while (nums.length < 7) {
        var n = Math.floor(Math.random() * 50);
        if (nums.indexOf(n) === -1) nums.push(n);
      }
      btn.hidden = true;
      runShow(nums, true);
      setTimeout(function () { btn.hidden = false; }, 20000);
    });
  }
})();
</script>
</body>
</html>
