# Quarry Sports Bar — Netlify configuration (Phase 2)
# Site root is the static site; functions live alongside it.

[build]
  publish = "site"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Poll results every 2 minutes, any day 11:00-22:00 UTC — supports midweek
# competitions. Harmless when no week is open (function self-skips).
[functions."results-sync"]
  schedule = "*/2 11-22 * * *"
